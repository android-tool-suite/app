name: Release debug

on:
  push:
    tags:
      - 'debug-*'

permissions:
  contents: write

concurrency:
  group: debug-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Validate immutable debug tag
        shell: pwsh
        env:
          DEBUG_TAG: ${{ github.ref_name }}
        run: |
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $env:DEBUG_TAG -cne "debug-$commit" -or $commit -cne $env:GITHUB_SHA) {
            throw 'Debug tag must match debug-<full checked-out commit SHA>.'
          }

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@90ddb51e90a5fd9ba75f40cf85156b7b41bf76a3
        with:
          gradle-version: '8.9'

      - name: Decode stable debug keystore
        shell: pwsh
        env:
          KEYSTORE_B64: ${{ secrets.ATS_DEBUG_KEYSTORE_B64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:KEYSTORE_B64)) {
            throw 'ATS_DEBUG_KEYSTORE_B64 is not configured'
          }
          $path = Join-Path $env:RUNNER_TEMP 'android-tool-suite-debug.p12'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:KEYSTORE_B64))
          "ATS_DEBUG_KEYSTORE_PATH=$path" >> $env:GITHUB_ENV

      - name: Test and build debug artifact
        shell: pwsh
        env:
          ATS_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.ATS_DEBUG_KEYSTORE_PASSWORD }}
          ATS_DEBUG_KEY_ALIAS: ${{ secrets.ATS_DEBUG_KEY_ALIAS }}
          ATS_DEBUG_KEY_PASSWORD: ${{ secrets.ATS_DEBUG_KEY_PASSWORD }}
        run: gradle clean :app:testDebugUnitTest collectArtifacts "-PatsCommitSha=${{ github.sha }}"

      - name: Verify debug APK signature
        shell: pwsh
        run: |
          $buildTools = Get-ChildItem (Join-Path $env:ANDROID_HOME 'build-tools') -Directory |
            Sort-Object { [version]$_.Name } -Descending |
            Select-Object -First 1
          if ($null -eq $buildTools) { throw 'Android build-tools not found' }
          & (Join-Path $buildTools.FullName 'apksigner.bat') verify --verbose --print-certs artifacts/android-tool-suite-debug.apk
          if ($LASTEXITCODE -ne 0) { throw 'Debug APK signature verification failed' }

      - name: Upload debug artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-tool-suite-${{ github.sha }}
          path: artifacts/android-tool-suite-debug.apk
          if-no-files-found: error

      - name: Prepare debug release assets
        shell: pwsh
        run: |
          .\.github\scripts\prepare-release.ps1 `
            -ArtifactPath .\artifacts\android-tool-suite-debug.apk `
            -OutputDirectory .\debug-dist `
            -Channel debug `
            -CommitSha '${{ github.sha }}'

      - name: Publish manually tagged debug release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: .\.github\scripts\publish-debug.ps1 -AssetDirectory .\debug-dist -Title 'Android Tool Suite Debug' -Tag '${{ github.ref_name }}'

      - name: Create registry app token
        id: registry-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.REGISTRY_APP_CLIENT_ID }}
          private-key: ${{ secrets.REGISTRY_APP_PRIVATE_KEY }}
          owner: android-tool-suite
          repositories: plugin-registry
          permission-contents: write

      - name: Notify plugin registry
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.registry-app-token.outputs.token }}
        run: .\.github\scripts\dispatch-registry.ps1 -Channel debug -Reference '${{ github.ref_name }}'
