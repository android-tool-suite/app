<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>离线文本检查</title>
    <link rel="stylesheet" href="/__ats__/theme.css">
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <main>
      <section class="intro" aria-labelledby="intro-title">
        <p class="eyebrow">完全离线</p>
        <h1 id="intro-title">文本概览</h1>
        <p class="supporting">内容只保留在当前页面内；关闭工具后不会保存。</p>
      </section>

      <section class="card" aria-label="文本统计">
        <label for="source">要检查的文本</label>
        <textarea id="source" rows="9" placeholder="在这里输入或粘贴文本" autofocus></textarea>
        <div class="metrics" aria-live="polite">
          <div><span>字符</span><strong id="characters">0</strong></div>
          <div><span>非空格</span><strong id="compact">0</strong></div>
          <div><span>单词</span><strong id="words">0</strong></div>
          <div><span>行数</span><strong id="lines">0</strong></div>
        </div>
      </section>

      <button id="clear" type="button">清空文本</button>
    </main>
  </body>
</html>
